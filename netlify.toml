# Netlify site configuration — one Netlify site per country landing page.
#
# France differs from the shared _tooling/netlify/netlify.toml in two places:
# the CSP allows Google Fonts (the redesigned page uses Fraunces + Quicksand from
# fonts.googleapis.com), and /img/* is cached like /assets/img/*. Re-running
# _tooling/install_netlify.py would overwrite this file and block the fonts.
#
# There is no build step. The site is plain static HTML/CSS/JS plus one
# dependency-free function, so Netlify publishes the folder as-is. Nothing to
# install, nothing to compile, no package.json to drift.

[build]
  publish = "."
  functions = "netlify/functions"

# Node 18+ gives the function global fetch, which is why it needs no npm deps.
[build.environment]
  NODE_VERSION = "20"

# The pages post to /api/enquiry (same origin). The function also declares this
# path itself via `export const config`, so this redirect is belt-and-braces:
# it keeps the endpoint working on older Netlify function runtimes too.
[[redirects]]
  from = "/api/enquiry"
  to = "/.netlify/functions/enquiry"
  status = 200
  force = true

# Deep links such as /universities.html are real files, so no SPA catch-all is
# wanted here — a bad URL should 404 rather than silently render the home page.

# ----------------------------------------------------------------- headers
[[headers]]
  for = "/*"
  [headers.values]
    # No third-party scripts: every script is a same-origin file in assets/js,
    # so script-src stays strict with no 'unsafe-inline'. style-src needs
    # 'unsafe-inline' for the page's <style> blocks and style="" attributes, plus
    # Google Fonts' stylesheet; font-src allows the font files it points to.
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self'; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      img-src 'self' data:; \
      font-src 'self' https://fonts.gstatic.com; \
      connect-src 'self' https://*.supabase.co; \
      form-action 'self'; \
      base-uri 'self'; \
      object-src 'none'; \
      frame-ancestors 'none'"""
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"

# HTML is regenerated by the build scripts, so it must never be served stale.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JS and CSS filenames are stable across rebuilds (main.js, main.css), so they
# cannot be cached immutably — a content change would never reach a returning
# visitor. Revalidate on every load; Netlify serves a 304 when unchanged.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fonts and photographs are effectively content-addressed by name — they change
# only when deliberately replaced — so they can be cached hard.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The enquiry endpoint must never be cached by a proxy.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
